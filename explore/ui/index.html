<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dnscount explorer</title>
<link rel="stylesheet" href="/ui/vendor/tabulator.min.css">
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/vendor/tabulator.min.js" defer></script>
<script src="/ui/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/overview">dnscount</a>
  <nav id="nav"></nav>
  <form class="find" id="find" role="search">
    <label for="find-q" class="visually-hidden">Find an IP or domain</label>
    <input id="find-q" type="search" placeholder="IP or domain" autocomplete="off" spellcheck="false">
  </form>
  <label class="since">since
    <select id="since">
      <option value="1h">1 hour</option>
      <option value="24h">24 hours</option>
      <option value="7d">7 days</option>
      <option value="30d">30 days</option>
      <option value="90d">90 days</option>
    </select>
  </label>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<footer class="foot muted" id="foot"></footer>
</body>
</html>
